[project]
name = "taskflow"
version = "1.0.0"
description = "Cloud-native TaskFlow API used by the DevOps automation capstone"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".cache", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The UI is a single dependency-free HTML template; wrapping it would harm readability.
"app/ui.py" = ["E501"]
"tools/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["migrations", ".venv", ".cache"]
