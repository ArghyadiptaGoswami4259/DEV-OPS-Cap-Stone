services:
  taskflow:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-1.0.0}
        GIT_SHA: ${APP_GIT_SHA:-local}
    image: taskflow:local
    environment:
      APP_ENVIRONMENT: local
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_GIT_SHA: ${APP_GIT_SHA:-local}
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+psycopg://taskflow:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@db:5432/taskflow
      LOG_LEVEL: INFO
      HOST: "0.0.0.0"
      FORWARDED_ALLOW_IPS: "127.0.0.1"
      PORT: "8080"
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["alembic upgrade head && exec python -m app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    labels:
      logging: "enabled"
    networks: ["taskflow"]
    restart: unless-stopped

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 10s
      timeout: 5s
      retries: 8
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    networks: ["taskflow"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: ["observability"]
    volumes:
      - ./platform/observability/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: ["taskflow"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./platform/observability/loki-local-config.yml:/etc/loki/local-config.yaml:ro
    networks: ["taskflow"]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./platform/observability/promtail-local-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: ["taskflow"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./platform/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./platform/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./platform/observability/grafana-dashboard-taskflow.json:/var/lib/grafana/dashboards/taskflow.json:ro
    ports:
      - "3000:3000"
    depends_on: ["prometheus", "loki"]
    networks: ["taskflow"]
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  taskflow:
    driver: bridge
