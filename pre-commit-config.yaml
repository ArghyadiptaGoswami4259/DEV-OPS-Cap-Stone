repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/bin/python -m ruff check --fix
        language: system
        types: [python]
      - id: validate-repo
        name: validate delivery manifests
        entry: .venv/bin/python tools/validate_repo.py
        language: system
        pass_filenames: false
        always_run: true
      - id: conventional-commit
        name: conventional commit message
        entry: .venv/bin/python tools/check_commit_message.py
        language: system
        stages: [commit-msg]
