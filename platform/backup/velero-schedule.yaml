apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: taskflow-production-daily
  namespace: velero
spec:
  schedule: "0 2 * * *"
  useOwnerReferencesInBackup: false
  template:
    ttl: 720h
    includedNamespaces:
      - taskflow-prod
      - monitoring
      - argocd
    includeClusterResources: true
    snapshotVolumes: true
    storageLocation: aws
    volumeSnapshotLocations:
      - aws
    defaultVolumesToFsBackup: true
    hooks:
      resources: []
