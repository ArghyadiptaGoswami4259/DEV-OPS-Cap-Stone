configuration:
  backupStorageLocation:
    - name: aws
      provider: aws
      bucket: REPLACE_WITH_BACKUP_BUCKET
      config:
        region: ap-south-1
  volumeSnapshotLocation:
    - name: aws
      provider: aws
      config:
        region: ap-south-1
  features: EnableCSI
credentials:
  useSecret: false
serviceAccount:
  server:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_WITH_BACKUP_ROLE_ARN
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.10.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /plugins
        name: plugins
deployNodeAgent: true
snapshotsEnabled: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
