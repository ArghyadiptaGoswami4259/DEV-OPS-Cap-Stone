prometheus:
  prometheusSpec:
    retention: 15d
    enableAdminAPI: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
alertmanager:
  alertmanagerSpec:
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "environment"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: platform-webhook
      routes:
        - matchers:
            - severity="critical"
          receiver: platform-webhook
          continue: true
    receivers:
      - name: platform-webhook
        webhook_configs:
          - url: http://alertmanager-webhook.monitoring.svc:9095/alerts
            send_resolved: true
    inhibit_rules:
      - source_matchers: ["severity=critical"]
        target_matchers: ["severity=warning"]
        equal: ["alertname", "environment"]
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: ["grafana.taskflow.local"]
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
