global:
  resolve_timeout: 5m
route:
  group_by: ["alertname", "environment"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: platform-webhook
receivers:
  - name: platform-webhook
    webhook_configs:
      - url: http://alertmanager-webhook.monitoring.svc:9095/alerts
        send_resolved: true
inhibit_rules:
  - source_matchers: ["severity=critical"]
    target_matchers: ["severity=warning"]
    equal: ["alertname", "environment"]
