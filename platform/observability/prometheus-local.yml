global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: taskflow
    metrics_path: /metrics
    static_configs:
      - targets: ["taskflow:8080"]
        labels:
          environment: local
          service: taskflow
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
