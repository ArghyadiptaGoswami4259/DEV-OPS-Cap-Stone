apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskflow-backup-reader
  namespace: taskflow-prod
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskflow-backup-reader
  namespace: taskflow-prod
subjects:
  - kind: ServiceAccount
    name: taskflow-backup
    namespace: taskflow-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: taskflow-backup-reader
