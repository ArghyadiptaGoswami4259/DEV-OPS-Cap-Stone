title = "TaskFlow secret-scanning configuration"

[extend]
useDefault = true

[allowlist]
description = "Ignore intentionally local lab-only values."
paths = [
  '''deploy/gitops/environments/dev/.*''',
  '''docs/lab-manual/assets/.*''',
  '''.*\.example''',
  '''.*lab-manual.*\.(pdf|docx)''',
]
regexes = [
  '''TASKFLOW_UNSET_[A-Z0-9_]+''',
  '''local-lab-only''',
  '''replace-with-a-random-local-password''',
  '''bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf''',
]
