apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
  labels:
    app: taskflow
data:
  APP_NAME: "TaskFlow"
  APP_ENVIRONMENT: "dev"
  APP_VERSION: "1.0.0"
  APP_GIT_SHA: "local"
  AUTO_CREATE_SCHEMA: "false"
  LOG_LEVEL: "INFO"
  OTEL_SERVICE_NAME: "taskflow"
  APP_FAILURE_RATE: "0"
  HOST: "0.0.0.0"
  FORWARDED_ALLOW_IPS: "127.0.0.1"
  PORT: "8080"
