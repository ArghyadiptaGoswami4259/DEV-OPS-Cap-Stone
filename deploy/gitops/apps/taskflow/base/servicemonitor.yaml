apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskflow
  labels:
    app: taskflow
    release: kube-prometheus
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: taskflow
      monitoring: enabled
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: false
