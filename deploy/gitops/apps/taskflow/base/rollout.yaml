apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: taskflow
  labels:
    app: taskflow
spec:
  replicas: 3
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      serviceAccountName: taskflow
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: taskflow
      containers:
        - name: taskflow
          image: ghcr.io/arghyadiptagoswami4259/dev-ops-cap-stone/taskflow:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: taskflow-config
            - secretRef:
                name: taskflow-db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    canary:
      stableService: taskflow-stable
      canaryService: taskflow-canary
      maxSurge: "25%"
      maxUnavailable: 0
      abortScaleDownDelaySeconds: 30
      steps:
        - setWeight: 20
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: taskflow-slo
            args:
              - name: namespace
                value: taskflow-dev
              - name: job
                value: taskflow-canary
        - setWeight: 50
        - pause:
            duration: 5m
        - analysis:
            templates:
              - templateName: taskflow-slo
            args:
              - name: namespace
                value: taskflow-dev
              - name: job
                value: taskflow-canary
        - setWeight: 100
