apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: taskflow-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: taskflow-db
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      data:
        DATABASE_URL: "postgresql+psycopg://{{ .username }}:{{ .password | urlquery }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
  dataFrom:
    - extract:
        key: REPLACE_WITH_RDS_SECRET_ARN
