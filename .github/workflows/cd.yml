name: CD - staging GitOps promotion

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, 'arena/**']
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Full sha256 image digest produced by CI'
        required: true
        type: string
      source_commit:
        description: 'Source commit SHA'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  packages: read
  id-token: write

concurrency:
  group: cd-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Verify signature and promote to staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
      - name: Download CI digest
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digest
          path: image-digest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve and validate digest
        id: digest
        env:
          INPUT_DIGEST: ${{ inputs.image_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [ -n "$INPUT_DIGEST" ]; then
            printf '%s' "$INPUT_DIGEST" > digest.txt
          else
            tr -d '\n' < image-digest/image-digest.txt > digest.txt
          fi
          DIGEST="$(cat digest.txt)"
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest" >&2
            exit 1
          fi
          if [ -n "$SOURCE_COMMIT" ]; then
            COMMIT="$SOURCE_COMMIT"
          else
            COMMIT="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install manifest tooling
        run: pip install PyYAML==6.0.2
      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify keyless signature, issuer and workflow identity
        env:
          IMAGE: ghcr.io/${{ github.repository }}/taskflow
        run: |
          IMAGE_LC="${IMAGE,,}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/heads/.*$" \
            "${IMAGE_LC}@${{ steps.digest.outputs.digest }}"
      - name: Update staging GitOps manifest
        run: |
          python tools/update_gitops.py \
            --environment staging \
            --digest "${{ steps.digest.outputs.digest }}" \
            --commit "${{ steps.digest.outputs.commit }}" \
            --approved-by "automation"
      - name: Verify staging release gate
        run: python tools/verify_release.py --environment staging
      - name: Commit immutable promotion [skip ci]
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          commit_message: "chore(gitops): promote ${{ steps.digest.outputs.commit }} to staging [skip ci]"
          commit_user_name: taskflow-bot
          commit_user_email: taskflow-bot@users.noreply.github.com
          file_pattern: deploy/gitops/environments/staging/*.yaml
