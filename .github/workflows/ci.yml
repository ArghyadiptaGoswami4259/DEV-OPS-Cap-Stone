name: CI

on:
  pull_request:
    branches: [main, 'arena/**']
    paths-ignore:
      - 'deploy/gitops/**'
      - 'docs/lab-manual/*.pdf'
      - 'docs/lab-manual/*.docx'
      - '**.md'
  push:
    branches: [main, 'arena/**']
    paths-ignore:
      - 'deploy/gitops/**'
      - 'docs/lab-manual/*.pdf'
      - 'docs/lab-manual/*.docx'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf # gitleaks:allow
  TRIVY_IGNOREFILE: platform/security/.trivyignore.yaml

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint and type-check
        run: |
          ruff check .
          mypy app
      - name: Unit and API tests
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing
      - name: Validate delivery manifests
        run: python tools/validate_repo.py
      - name: Python SAST
        run: bandit -r app -ll -f txt
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --strict
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  security:
    name: CodeQL, secrets and filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: python
          queries: security-extended,security-and-quality
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: platform/security/gitleaks.toml
      - name: Install pinned Trivy binary
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          mkdir -p /tmp/trivy "$HOME/.local/bin"
          download() {
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-max-time 300 --retry-all-errors \
              --connect-timeout 10 --max-time 90 \
              --output "$1" "$2"
          }
          download "/tmp/trivy/${archive}" "${url}"
          echo "${TRIVY_SHA256}  /tmp/trivy/${archive}" | sha256sum -c -
          tar -xzf "/tmp/trivy/${archive}" -C /tmp/trivy trivy
          install -m 0755 /tmp/trivy/trivy "$HOME/.local/bin/trivy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version
      - name: Trivy filesystem, IaC and secret scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true
          skip-dirs: .venv,.cache,.git,docs/lab-manual
      - name: Upload filesystem SARIF
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          category: codeql-python

  container:
    name: Build, scan, sign and publish immutable image
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve lowercase image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/taskflow" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=stable,enable={{is_default_branch}}
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ github.event_name == 'push' && steps.meta.outputs.tags || 'taskflow:ci' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve scan target
        id: scan
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "ref=${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=taskflow:ci" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Trivy binary
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          mkdir -p /tmp/trivy "$HOME/.local/bin"
          download() {
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-max-time 300 --retry-all-errors \
              --connect-timeout 10 --max-time 90 \
              --output "$1" "$2"
          }
          download "/tmp/trivy/${archive}" "${url}"
          echo "${TRIVY_SHA256}  /tmp/trivy/${archive}" | sha256sum -c -
          tar -xzf "/tmp/trivy/${archive}" -C /tmp/trivy trivy
          install -m 0755 /tmp/trivy/trivy "$HOME/.local/bin/trivy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ steps.scan.outputs.ref }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
      - name: Upload image SARIF
        if: ${{ always() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Generate SPDX SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.scan.outputs.ref }}
          format: spdx-json
          output-file: taskflow.spdx.json
          upload-artifact: true
      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Keyless sign image
        if: github.event_name == 'push'
        run: cosign sign --yes "${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}"
      - name: Publish digest artifact
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          echo "${{ steps.build.outputs.digest }}" > dist/image-digest.txt
      - name: Upload digest artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest
          path: dist/image-digest.txt
          retention-days: 7
